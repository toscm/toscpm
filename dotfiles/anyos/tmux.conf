# General Settings
set -g default-terminal "tmux-256color"
# Pass OSC 8 hyperlinks through to the outer terminal (needs tmux 3.4 or newer).
# tmux emits them only for terminals it believes support them, and it believes
# that of almost no TERM value, so Windows Terminal and iTerm2 have to be told
# here. This is what makes the link printed by `code` clickable inside tmux.
set -as terminal-features ",*:hyperlinks"
set -g base-index 1
set -g history-limit 50000
set -g status-position top
set -g status-left ""
set -g status-left-length 0
# The branch in status-right comes from #(), which only re-runs on this
# interval, so keep it short enough that a `cd` into another repo shows up fast.
set -g status-interval 5
set -g mouse on
set -g set-clipboard on
setw -g mode-keys vi
set -s escape-time 10

# Light/dark: follow the terminal when Windows toggles its theme.
#
# The status bar uses the terminal's own default colours, reversed, so the
# terminal resolves them at render time and the bar flips with the scheme
# without tmux having to know about it. Kept in a user option so MOVE MODE
# below can restore it.
set -g @status_style "fg=default,bg=default,reverse"
set -gF status-style "#{@status_style}"
#
# Apps in a pane (bat, delta, nvim) ask tmux for the background colour (OSC 11)
# and tmux answers from a copy it read from the terminal on attach. It re-reads
# that copy only when the terminal reports a theme change (mode 2031), which
# Windows Terminal does not do, so the copy stayed light until the next attach.
# Ask the terminal again whenever it regains focus: tmux takes the unsolicited
# reply, updates its copy and sends a 2031 notification to panes that asked for
# one. Writing the query to the client tty ourselves avoids the full redraw
# (a visible flicker) that forcing tmux to re-query via SIGWINCH causes.
set -g focus-events on
set-hook -g client-focus-in {
  run-shell -b "[ -w '#{client_tty}' ] && printf '\\033]10;?\\007\\033]11;?\\007' > '#{client_tty}'"
}

# Status-right: user, current dir, git branch (empty outside a repo), time.
# Defined once as a user option so the MOVE MODE bindings below can restore it
# with #{T:@status_right} instead of repeating the whole string (T:, not E:, so
# the strftime %H:%M inside it is expanded too).
set -g @status_right " #(whoami)  #{s,^/(home|Users)/[^/]*,~,:pane_current_path}#((git -C '#{pane_current_path}' symbolic-ref --short -q HEAD || git -C '#{pane_current_path}' rev-parse --short HEAD) 2>/dev/null | sed 's/^/  /')  %H:%M "
set -g status-right "#{T:@status_right}"
set -g status-right-length 100

# Reload config
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Switch panes directly with Alt+<arrow> (no prefix, no move mode).
# Ctrl+<arrow> is left free for in-app word navigation (readline/CLIs).
bind-key -n M-Up    select-pane -U
bind-key -n M-Down  select-pane -D
bind-key -n M-Left  select-pane -L
bind-key -n M-Right select-pane -R

# Copy mode (vi): enter with the built-in `[`, copy+exit with `y`
# (`v` is now a split key, see below)
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Enter copy mode without the prefix. M-m ("mark mode") is the low-conflict
# choice; M-c is also bound but note it shadows readline's M-c capitalize-word.
bind-key -n M-m copy-mode
bind-key -n M-c copy-mode

# Mouse drag-release: copy to buffer but STAY in copy mode and keep the
# selection highlighted (so you can paste elsewhere and keep extending it).
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Y = yank but STAY in copy mode with the selection still highlighted
# (lowercase y still copies-and-exits, the usual default).
bind-key -T copy-mode-vi Y send-keys -X copy-selection-no-clear

# Splits (prefix) — also bound in MOVE MODE. New pane keeps current dir.
# v = side-by-side (vertical divider) | h = top/bottom (horizontal divider)
bind-key v   split-window -h -c "#{pane_current_path}"
bind-key h   split-window -v -c "#{pane_current_path}"
bind-key "'" split-window -h -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"

# Enter move/layout mode (Ctrl-b g)
bind-key g \
  set -g status-style "fg=black,bg=colour208" \; \
  set -g pane-active-border-style "fg=colour208" \; \
  set -g status-right " focus:ijkl,. move:IJKL<> others:coxz " \; \
  switch-client -T layout-edit

# Focus panes  (i=up, j=left, k=down, l=right) + arrows
bind-key -T layout-edit i select-pane -U \; switch-client -T layout-edit
bind-key -T layout-edit j select-pane -L \; switch-client -T layout-edit
bind-key -T layout-edit k select-pane -D \; switch-client -T layout-edit
bind-key -T layout-edit l select-pane -R \; switch-client -T layout-edit
bind-key -T layout-edit Up    select-pane -U \; switch-client -T layout-edit
bind-key -T layout-edit Left  select-pane -L \; switch-client -T layout-edit
bind-key -T layout-edit Down  select-pane -D \; switch-client -T layout-edit
bind-key -T layout-edit Right select-pane -R \; switch-client -T layout-edit

# Move/swap panes  (shift+ijkl) + Ctrl+arrows
bind-key -T layout-edit I swap-pane -s . -t '{up}'    \; switch-client -T layout-edit
bind-key -T layout-edit J swap-pane -s . -t '{left}'  \; switch-client -T layout-edit
bind-key -T layout-edit K swap-pane -s . -t '{down}'  \; switch-client -T layout-edit
bind-key -T layout-edit L swap-pane -s . -t '{right}' \; switch-client -T layout-edit
bind-key -T layout-edit C-Up    swap-pane -s . -t '{up}'    \; switch-client -T layout-edit
bind-key -T layout-edit C-Left  swap-pane -s . -t '{left}'  \; switch-client -T layout-edit
bind-key -T layout-edit C-Down  swap-pane -s . -t '{down}'  \; switch-client -T layout-edit
bind-key -T layout-edit C-Right swap-pane -s . -t '{right}' \; switch-client -T layout-edit

# Windows: focus by number (1-9), prev/next (,/.), move (</>)
bind-key -T layout-edit 1 select-window -t 1 \; switch-client -T layout-edit
bind-key -T layout-edit 2 select-window -t 2 \; switch-client -T layout-edit
bind-key -T layout-edit 3 select-window -t 3 \; switch-client -T layout-edit
bind-key -T layout-edit 4 select-window -t 4 \; switch-client -T layout-edit
bind-key -T layout-edit 5 select-window -t 5 \; switch-client -T layout-edit
bind-key -T layout-edit 6 select-window -t 6 \; switch-client -T layout-edit
bind-key -T layout-edit 7 select-window -t 7 \; switch-client -T layout-edit
bind-key -T layout-edit 8 select-window -t 8 \; switch-client -T layout-edit
bind-key -T layout-edit 9 select-window -t 9 \; switch-client -T layout-edit
bind-key -T layout-edit ',' previous-window \; switch-client -T layout-edit
bind-key -T layout-edit '.' next-window     \; switch-client -T layout-edit
bind-key -T layout-edit '<' swap-window -t -1 \; select-window -t -1 \; switch-client -T layout-edit
bind-key -T layout-edit '>' swap-window -t +1 \; select-window -t +1 \; switch-client -T layout-edit

# Create / split  (new pane/window keeps current dir)
bind-key -T layout-edit c   new-window      -c "#{pane_current_path}" \; switch-client -T layout-edit
bind-key -T layout-edit v   split-window -h -c "#{pane_current_path}" \; switch-client -T layout-edit
bind-key -T layout-edit h   split-window -v -c "#{pane_current_path}" \; switch-client -T layout-edit
bind-key -T layout-edit "'" split-window -h -c "#{pane_current_path}" \; switch-client -T layout-edit
bind-key -T layout-edit "-" split-window -v -c "#{pane_current_path}" \; switch-client -T layout-edit

# Other actions
bind-key -T layout-edit o select-pane -t :.+ \; switch-client -T layout-edit
bind-key -T layout-edit r rotate-window      \; switch-client -T layout-edit
bind-key -T layout-edit z resize-pane -Z     \; switch-client -T layout-edit
bind-key -T layout-edit m select-pane -m     \; switch-client -T layout-edit
bind-key -T layout-edit s swap-pane          \; switch-client -T layout-edit
bind-key -T layout-edit x kill-pane          \; switch-client -T layout-edit

# Pane action menu (Enter) + jump-to-anything tree (w)
bind-key -T layout-edit Enter \
  display-menu -T "#[align=centre] tmux " -x P -y P \
    "New window"   c "new-window -c \"#{pane_current_path}\"" \
    "Split right"  v "split-window -h -c \"#{pane_current_path}\"" \
    "Split down"   h "split-window -v -c \"#{pane_current_path}\"" \
    "" \
    "#{?pane_marked,Unmark,Mark}" m "select-pane -m" \
    "Swap w/ mark" s "swap-pane" \
    "Rotate"       r "rotate-window" \
    "" \
    "Zoom"         z "resize-pane -Z" \
    "Kill pane"    x "kill-pane" \
    "" \
    "Choose tree"  t "choose-tree -Zw" \
  \; switch-client -T layout-edit
bind-key -T layout-edit w choose-tree -Zw \; switch-client -T layout-edit

# Exit move mode (restore normal status bar)
bind-key -T layout-edit q \
  set -gF status-style "#{@status_style}" \; \
  set -gu pane-active-border-style \; \
  set -g status-right "#{T:@status_right}" \; \
  switch-client -T root
bind-key -T layout-edit Escape \
  set -gF status-style "#{@status_style}" \; \
  set -gu pane-active-border-style \; \
  set -g status-right "#{T:@status_right}" \; \
  switch-client -T root

# Size windows after the most recently active client, not the smallest one,
# so a forgotten client on another machine does not cap the terminal height.
set -g window-size latest
