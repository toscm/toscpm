# Enter a directory, or open a hovered file (a PDF opens in pdfv, see yazi.toml)
[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

# === 1. Edit the path bar / jump anywhere by typing ========================
# <C-l>: type or Tab-complete an arbitrary path (Double Commander path bar).
[[mgr.prepend_keymap]]
on   = "<C-l>"
run  = "cd --interactive"
desc = "Type a path to cd into"

# z / Z: jump by zoxide history / fuzzy-find with fzf (both built-in).
[[mgr.prepend_keymap]]
on   = "z"
run  = "plugin zoxide"
desc = "Jump to a dir via zoxide"

[[mgr.prepend_keymap]]
on   = "Z"
run  = "plugin fzf"
desc = "Jump to a dir/file via fzf"

# === 2. Run any shell command inside the current dir =======================
[[mgr.prepend_keymap]]
on   = ";"
run  = "shell --interactive"
desc = "Run a shell command in the cwd"

[[mgr.prepend_keymap]]
on   = ":"
run  = "shell --interactive --block"
desc = "Run a shell command in the cwd (block until it exits)"

# === 3. Quick filter — press f, then type to filter live ===================
[[mgr.prepend_keymap]]
on   = "f"
run  = "filter --smart"
desc = "Filter the current dir as you type"

# === 4. Bookmarks (yamb plugin) ============================================
# Core loop = 2 keys: b = save, gb = jump. B/R are optional housekeeping.
[[mgr.prepend_keymap]]
on   = "b"
run  = "plugin yamb -- save"
desc = "Bookmark the current directory"

# gb: "goto bookmark" — fits yazi's built-in g-prefix goto convention.
[[mgr.prepend_keymap]]
on   = ["g", "b"]
run  = "plugin yamb -- jump_by_fzf"
desc = "Go to a bookmark (fzf)"

# B: manage = delete a bookmark. R: rename one.
[[mgr.prepend_keymap]]
on   = "B"
run  = "plugin yamb -- delete_by_fzf"
desc = "Delete a bookmark (fzf)"

[[mgr.prepend_keymap]]
on   = "R"
run  = "plugin yamb -- rename_by_fzf"
desc = "Rename a bookmark (fzf)"

# === 5. Open tmux windows/panes in the current dir =========================
# Mnemonics mirror tmux's own split keys: % = right, " = below.
[[mgr.prepend_keymap]]
on   = "T"
run  = 'shell -- tmux new-window -c "$PWD"'
desc = "Open & focus a new tmux window in the cwd"

[[mgr.prepend_keymap]]
on   = "%"
run  = 'shell -- tmux split-window -h -c "$PWD"'
desc = "Open & focus a tmux pane to the right, in the cwd"

[[mgr.prepend_keymap]]
on   = '"'
run  = 'shell -- tmux split-window -v -c "$PWD"'
desc = "Open & focus a tmux pane below, in the cwd"

# === 6. Brief / detailed view (Total Commander: Ctrl+F1 / Ctrl+F2) =========
# "details" is a custom linemode defined in init.lua.
# m d / m n are fallbacks in case macOS grabs Ctrl+F1 / Ctrl+F2.
[[mgr.prepend_keymap]]
on   = "<C-F1>"
run  = "linemode none"
desc = "Brief view: file names only"

[[mgr.prepend_keymap]]
on   = "<C-F2>"
run  = "linemode details"
desc = "Detailed view: name, ext, size, modified"

[[mgr.prepend_keymap]]
on   = ["m", "d"]
run  = "linemode details"
desc = "details"

# === 7. Resize the panes (local resize-pane plugin) ========================
# Alt+h / Alt+l move the divider between file list and preview by a tenth;
# Alt+0 restores the ratio from yazi.toml. Alt is Option on macOS.
[[mgr.prepend_keymap]]
on   = "<A-h>"
run  = "plugin resize-pane -- left"
desc = "Move the divider left (larger preview)"

[[mgr.prepend_keymap]]
on   = "<A-l>"
run  = "plugin resize-pane -- right"
desc = "Move the divider right (larger file list)"

[[mgr.prepend_keymap]]
on   = "<A-0>"
run  = "plugin resize-pane -- reset"
desc = "Reset the pane sizes"

# === 8. Backspace and Delete as in a GUI file manager ======================
# Backspace goes to the parent folder; Delete (Entf) moves the selected or
# hovered files to the trash after a confirmation, like the built-in d.
[[mgr.prepend_keymap]]
on   = "<Backspace>"
run  = "leave"
desc = "Go to the parent folder"

[[mgr.prepend_keymap]]
on   = "<Delete>"
run  = "remove"
desc = "Trash the selected files"
