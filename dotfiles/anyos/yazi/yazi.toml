# Layout: hide the parent pane — panes are [parent, current, preview].
# 0/4/4 gives no parent column, equal current + preview.
[mgr]
ratio = [0, 4, 4]

# Shell popup (; and :) opens at the bottom, full width, just above the status
# bar, so it feels like Total Commander's command line.
[input]
shell_origin = "bottom-left"
shell_offset = [0, -1, 1000, 3]

# Upper limit, in pixels, for image and PDF previews (default 600x900).
# 9999 means no limit in practice: previews are drawn at the pane's own pixel
# size, which on a large or high-dpi (Retina) screen exceeds the default.
# yazi only shrinks images, never enlarges them, so a picture smaller than
# the pane still shows at its own size.
[preview]
max_width  = 9999
max_height = 9999

# PDFs go to the local pdf-view plugin (rendered at the pane's pixel size)
# instead of the built-in previewer. It also takes the PDF preloader slot, so
# the built-in one does not render a 150 dpi copy that would never be shown.
[plugin]
prepend_previewers = [{ mime = "application/pdf", run = "pdf-view" }]
prepend_preloaders = [{ mime = "application/pdf", run = "pdf-view" }]
